<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f2a1e" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"

  <body>
    <div id="root"></div>
    <noscript>AgriGuard needs JavaScript enabled to run.</noscript>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Friendly hint if someone opens this file with "Live Server" / double-click
      // instead of running the Vite dev server (this is what causes a blank white page).
      if (location.port === '5500' || location.protocol === 'file:') {
        document.body.innerHTML =
          '<div style="font-family:system-ui,sans-serif;max-width:560px;margin:12vh auto;padding:24px;line-height:1.6">' +
          '<h2 style="color:#0f2a1e">Open this app with Vite, not Live Server</h2>' +
          '<p>This is a React + Vite project. In a terminal run:</p>' +
          '<pre style="background:#0f2a1e;color:#b7e34b;padding:14px;border-radius:10px">cd frontend\nnpm install\nnpm run dev</pre>' +
          '<p>Then open <b>http://localhost:5173</b></p></div>';
      }
    </script>
  </body>
</html>
