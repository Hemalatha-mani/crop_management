services:
  - type: web
    name: crop-disease-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # TensorFlow 2.17 has no wheels for Python 3.13 - pin a supported version.
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: crop-disease-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      # Set this to your Vercel URL, e.g. https://your-app.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MODEL_PATH
        value: ml_models/crop_disease_model_final.keras
      - key: MODEL_INPUT_SIZE
        value: "224"
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"

databases:
  - name: crop-disease-db
    plan: free
    databaseName: crop_disease_db
    user: crop_disease_user
